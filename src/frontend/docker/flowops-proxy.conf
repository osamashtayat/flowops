# Included in every proxied location: nginx drops server-level proxy_set_header in a location that sets its own.
# Host keeps the port, because SameOriginHubGuard compares it with the browser's Origin.
# X-Forwarded-For is replaced, not appended, so a client can't forge the address the login rate limit sees.
# X-Forwarded-Proto tells the API the browser used HTTPS.
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
