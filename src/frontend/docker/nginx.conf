# OPS-01: one origin for the SPA, /api and /hubs (ARCHITECTURE.md: same origin, no CORS). TLS ends here: the session and
# antiforgery cookies are Secure (__Host-), and antiforgery refuses requests that didn't arrive over HTTPS.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8443 ssl;
    http2 on;
    server_tokens off;
    root /usr/share/nginx/html;

    # Self-signed for localhost unless you mount your own (40-flowops-tls.sh).
    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location /api/ {
        include /etc/nginx/flowops-proxy.conf;
        proxy_pass http://api:8080;
    }

    # SignalR: WebSockets need the upgrade headers; long polling and server-sent events need no buffering.
    location /hubs/ {
        include /etc/nginx/flowops-proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_pass http://api:8080;
    }

    # Same CSP the API sends outside Development (AUTHORIZATION.md §1.5).
    location /assets/ {
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
